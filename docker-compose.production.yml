# Portfolio production — Supabase-native (Prisma/Postgres YOK).
# DB + Auth + Storage = Supabase (cloud proje). Bu stack sadece Next.js app'i.
# Caddy ayrı bir stack'te (../infra/) merkezi reverse proxy olarak çalışır.
#
# Gerekli env (.env veya deploy ortamı):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (build-time, client'a gömülür)
#   SUPABASE_SERVICE_ROLE_KEY                                (runtime, GİZLİ)
#   NEXT_PUBLIC_SITE_URL
#   SUPABASE_BUCKET_IMAGES / _DEMOS / _DOWNLOADS             (opsiyonel, default images/demos/downloads)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: portfolio-app:latest
    container_name: portfolio-prod-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_BUCKET_IMAGES: ${SUPABASE_BUCKET_IMAGES:-images}
      SUPABASE_BUCKET_DEMOS: ${SUPABASE_BUCKET_DEMOS:-demos}
      SUPABASE_BUCKET_DOWNLOADS: ${SUPABASE_BUCKET_DOWNLOADS:-downloads}
    networks:
      - web # Caddy reverse proxy bu network üzerinden ulaşır
    expose:
      - "3001" # Sadece Docker network içinde, host'a açık değil
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  web:
    # Caddy reverse proxy ile paylaşılan network (../infra tarafından oluşturulur)
    external: true
    name: web
